name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-dev"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          swift --version

      - name: Test
        run: |
          swift test --package-path Packages/DiskKit
          swift test --package-path App

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=${{ secrets.MACOS_SIGN_IDENTITY }}" >> "$GITHUB_ENV"

      - name: Build app
        run: UNIVERSAL=1 scripts/build-app.sh

      - name: Package
        run: |
          mkdir -p dist
          ZIP="dist/UMounter-$VERSION.zip"
          DMG="dist/UMounter-$VERSION.dmg"
          ditto -c -k --keepParent App/build/UMounter.app "$ZIP"
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R App/build/UMounter.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname UMounter -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          if [[ -n "${SIGN_IDENTITY:-}" ]]; then codesign --force --timestamp --sign "$SIGN_IDENTITY" "$DMG"; fi
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize
        if: env.MACOS_CERTIFICATE != '' && env.NOTARY_APPLE_ID != ''
        env:
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool submit "$DMG" --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "$DMG"
          # The zip can't be stapled itself; staple the app and re-zip it.
          xcrun stapler staple App/build/UMounter.app
          rm "$ZIP" && ditto -c -k --keepParent App/build/UMounter.app "$ZIP"

      - name: Checksums
        run: cd dist && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: UMounter-${{ env.VERSION }}
          path: dist/*

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          [[ "$VERSION" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --title "UMounter $VERSION" --generate-notes $PRERELEASE \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
